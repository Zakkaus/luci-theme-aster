<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <title>Ray Floret</title>
  <!-- The Aster mark on the Aster palette's accent disc. A favicon
       inherits no colour and does not follow the reader's palette, so the
       colours are stated here: the light accent and on-accent ink, and the
       dark pair for a dark browser chrome. -->
  <style>:root{--badge:#225BFF;--ink:#FFFFFF}@media(prefers-color-scheme:dark){:root{--badge:#3D87FF;--ink:#0B1020}}</style>
  <circle cx="16" cy="16" r="16" fill="var(--badge)"/>
  <g transform="translate(4 4)" color="var(--ink)" fill="currentColor">
    <defs><path id="quill" d="M10.4 8.6C8.9 6.1 10.6 3.3 13.5 1.6C14.9 4.6 14.1 7.5 12.8 9.1Z"/></defs>
    <use href="#quill"/><use href="#quill" transform="rotate(60 12 12)"/>
    <use href="#quill" transform="rotate(120 12 12)"/><use href="#quill" transform="rotate(180 12 12)"/>
    <use href="#quill" transform="rotate(240 12 12)"/><use href="#quill" transform="rotate(300 12 12)"/>
  </g>
</svg>
