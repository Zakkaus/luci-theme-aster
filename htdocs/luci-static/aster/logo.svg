<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <title>Ray Floret</title>
  <!-- The favicon: the Aster mark bare, in the default palette's accent
       (Rosé Pine: pine in a light browser, foam in a dark one; a favicon
       inherits no colour, so the values are stated here). theme-aster.js
       swaps in the same mark in the page's own accent once it loads. The
       quills are a little fuller than the header's to hold at 16 px. -->
  <style>:root{fill:#286983}@media(prefers-color-scheme:dark){:root{fill:#9CCFD8}}</style>
  <defs><path id="quill" d="M10.1 8.8C8.4 6.1 10.2 3 13.6 1.2C15.3 4.5 14.5 7.7 13.1 9.3Z"/></defs>
  <use href="#quill"/><use href="#quill" transform="rotate(60 12 12)"/>
  <use href="#quill" transform="rotate(120 12 12)"/><use href="#quill" transform="rotate(180 12 12)"/>
  <use href="#quill" transform="rotate(240 12 12)"/><use href="#quill" transform="rotate(300 12 12)"/>
</svg>
